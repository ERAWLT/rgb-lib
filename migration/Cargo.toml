[package]
name = "rgb-lib-migration"
version = "0.3.0-beta.5"
authors = [
    "Zoe Faltibà <zoefaltiba@gmail.com>",
    "Nicola Busanello <nicola.busanello@gmail.com>",
]
edition = "2024"
rust-version = "1.94.0"
repository = "https://github.com/RGB-Tools/rgb-lib"
homepage = "https://github.com/RGB-Tools/rgb-lib"
license = "MIT"
description = "RGB wallet library migrations"

[lib]
name = "rgb_lib_migration"
path = "src/lib.rs"

# the sea-orm-cli migration binary (see README.md); rgb-lib only links the library
[[bin]]
name = "rgb-lib-migration"
path = "src/main.rs"
required-features = ["cli"]

[features]
# ERA fork: the CLI and Postgres are only needed to author migrations. They stay on by default so
# `sea-orm-cli migrate` keeps working here; rgb-lib depends on this crate without them.
default = ["cli"]
cli = [
    "sea-orm-migration/cli",
    "sea-orm-migration/runtime-tokio-rustls",
    "sea-orm-migration/sqlx-postgres",
]

[dependencies]
tokio = { version = "1", default-features = false, features = [
    "macros"
] }
sea-orm-migration = { version = "2.0.1", default-features = false, features = [
    "runtime-tokio",
    "sqlx-sqlite",
] }
