[package]
name = "rgb-lib"
version = "0.3.0-beta.7"
authors = [
    "Zoe Faltibà <zoefaltiba@gmail.com>",
    "Nicola Busanello <nicola.busanello@gmail.com>",
]
edition = "2024"
rust-version = "1.94.0"
repository = "https://github.com/RGB-Tools/rgb-lib"
homepage = "https://github.com/RGB-Tools/rgb-lib"
license = "MIT"
description = "RGB wallet library"
exclude = ["migration"]

[workspace]
members = [".", "migration"]

[dependencies]
base64 = { version = "0.22.1", default-features = false, features = [
    "std",
] }
bdk_wallet = { version = "=3.1.0", default-features = false, features = [
    "file_store",
    "keys-bip39",
    "std",
] }
bdk_electrum = { version = "0.24.0", optional = true, default-features = false, features = [
    "use-rustls",
] }
bdk_esplora = { version = "0.22.2", optional = true, default-features = false, features = [
    "blocking-https-rustls",
] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = [
    "alloc",
] }
# ERA fork: Runtime::new and the VSS client need "rt-multi-thread", which used to arrive only
# through sea-orm-cli (the migration CLI)
tokio = { version = "1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
] }
# ERA fork: encode/decode need "alloc"; "std" was only ever enabled by sqlx-postgres, which the
# library no longer pulls in
hex = { version = "0.4.3", default-features = false, features = [
    "std",
] }
rand = { version = "0.10.1", default-features = false, features = [
    "thread_rng",
] }
# ERA fork: one TLS stack on every target. reqwest's own "rustls" feature would bring aws-lc
# and rustls-platform-verifier (JNI setup on Android), and the Android build used to add a
# vendored OpenSSL through native-tls on top. "rustls-no-provider" plus the ring-based config
# built in api::rest_client_builder leaves rustls on ring, the stack minreq (esplora) and bitreq
# (vss) already use. The other reqwest defaults are kept as they were.
reqwest = { version = "0.13", optional = true, default-features = false, features = [
    "blocking",
    "charset",
    "http2",
    "json",
    "multipart",
    "rustls-no-provider",
    "system-proxy",
] }
# ERA fork: default features off drops the migration CLI (clap, sea-orm-cli) and sqlx-postgres,
# which only the migration authoring binary uses.
rgb-lib-migration = { path = "migration", version = "0.3.0-beta.5", default-features = false }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
scrypt = { version = "0.12.0", default-features = false, features = [
    "phc",
] }
sea-orm = { version = "2.0.1", default-features = false, features = [
    "macros",
    "runtime-tokio",
    "sqlx-sqlite",
    "with-json",
] }
sea-query = "1.0.1"
serde = { version = "^1.0", default-features = false, features = [
    "derive",
] }
serde_json = { version = "^1.0", default-features = false, features = [
    "preserve_order",
] }
slog = { version = "2.8.2", default-features = false }
slog-async = { version = "2.8.0", default-features = false }
slog-term = { version = "2.9.2", default-features = false }
tempfile = { version = "3.27.0", default-features = false }
thiserror = { version = "2.0", default-features = false }
time = { version = "0.3.52", default-features = false }
file-format = { version = "0.29.0", default-features = false, features = [
    "reader",
] }
url = { version = "2.5", default-features = false }
walkdir = { version = "2.5.0", default-features = false }
webpki-roots = { version = "1", default-features = false, optional = true }
zip = { version = "8.6.0", default-features = false, features = [
    "zstd",
] }

# VSS backup (optional)
vss-client = { package = "vss-client-ng", git = "https://github.com/lightningdevkit/vss-client", rev = "ad63805047561dcf3117cd992ad6d8bc3881adef", default-features = false, optional = true, features = [
    "sigs-auth",
] }
hkdf = { version = "0.12", default-features = false, optional = true }
p256 = { version = "0.13", features = ["ecdsa"], optional = true }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"], optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }

# RGB-related deps
amplify = { version = "=4.8.1", default-features = false }
rgb-invoicing = { version = "=0.11.1-rc.11", default-features = false }
rgb-psbt-utils = { version = "=0.11.1-rc.11", default-features = false }
rgb-schemas = { version = "=0.11.1-rc.11", default-features = false }
rgb-ops = { version = "=0.11.1-rc.11", default-features = false, features = [
    "serde",
] }
rgb-strict-encoding = { version = "=1.0.2", default-features = false, features = [
    "bitcoin",
] }
rgb-strict-types = { version = "=1.0.2", default-features = false }

[dev-dependencies]
biscuit-auth = { version = "6.0.0", default-features = false, features = [
    "datalog-macro",
]}
chrono = "0.4"
confy = { version = "2.0.0", default-features = false, features = [
    "toml_conf",
] }
copy_dir = { version = "0.1.3", default-features = false }
dircmp = { version = "0.2.0", default-features = false }
mockito = { version = "1", default-features = false }
once_cell = { version = "1.21", default-features = false }
regex = { version = "1.13", default-features = false }
serial_test = { version = "3.5", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = ["electrum"]
all = ["electrum", "esplora", "vss"]
electrum = [
    "bdk_electrum",
    "reqwest",
    "dep:webpki-roots",
    "rgb-ops/electrum_blocking",
]
esplora = [
    "bdk_esplora",
    "reqwest",
    "dep:webpki-roots",
    "rgb-ops/esplora_blocking",
]
vss = ["vss-client", "hkdf", "dep:sha2"]
mpc = []
dfns = ["mpc", "dep:p256", "dep:ed25519-dalek", "dep:sha2"]
camel_case = ["default"]

[[example]]
name = "vss_example"
required-features = ["vss"]

[[example]]
name = "vss_unencrypted_example"
required-features = ["vss"]

[[example]]
name = "dfns_e2e"
required-features = ["dfns", "electrum"]

[[example]]
name = "bdk_peer"
required-features = ["electrum"]

[profile.release]
# make overflow bugs fail loudly instead of producing wrong amounts
overflow-checks = true

[profile.reldebug]
inherits = "release"
debug = 1
