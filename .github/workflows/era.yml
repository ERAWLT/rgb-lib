name: ERA fork checks

# CI for ERAWLT/rgb-lib's own branches (era/**). The inherited upstream
# workflows only fire on UTEXO's branch names (build/test/lint/format) or are
# restricted to the UTEXO-Protocol owner (AI reviews, release), so this is the
# only workflow that runs on our pushes. That restriction does not cover every
# event; ERA.md section 2 says which ones and what closes them.
#
# The check job proves what the fork adds without the regtest services the
# upstream test suite needs:
#   - the keychain-layout patch (unit tests, no network);
#   - the crate still builds with the exact feature set the ERA app uses
#     (packages/era_rgb: no default features, esplora + vss) and with the
#     upstream default (electrum) on top;
#   - the dependency diet holds: no OpenSSL, aws-lc, Postgres or CLI crates
#     on the app's mobile targets, every HTTP client goes through the one
#     prebuilt TLS config, and that config works.
#   - the proxy forwarder patch: with OnlineOptions::forwarder_url set, every
#     RGB proxy and reject-list request goes to the loopback forwarder (unit
#     tests against local mock servers, plus a guard on how wallet code builds
#     those clients);
#   - the bindings still build: the uniffi UDL mirrors the Error enum, and a
#     variant the fork adds without mirroring it breaks only that build.
# The https job makes real TLS handshakes against UTEXO's public signet
# services; it depends on third-party hosts, so it is kept out of check.
# See ERA.md for what the fork changes and why.

on:
  push:
    branches: ["era/**"]
  pull_request:
    branches: ["era/**"]
  workflow_dispatch:
  # GitHub fires schedule only from the default branch. While that is UTEXO's
  # dev (no era.yml there) this never runs, and the https job runs only when
  # dispatched by hand.
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  # per event too: a push must not cancel a scheduled or dispatched https run
  group: era-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # the schedule exists for the https job only
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          # the action defaults to "-D warnings"; a lint added by a new stable
          # release in upstream code must not fail the fork's CI
          rustflags: ""

      - name: Format
        run: cargo fmt --all -- --check

      # --locked everywhere: a fresh resolution fails on the yanked
      # secp256k1 0.32.0-beta.2 that rgb-consensus rc.11 requires, so the
      # committed Cargo.lock is the only thing that resolves.
      - name: Check with the app's feature set (no default features, esplora + vss)
        run: cargo check --locked --no-default-features --features esplora,vss

      - name: Check with default features + esplora + vss
        run: cargo check --locked --features esplora,vss

      # Each binding is a workspace of its own, with its own Cargo.lock. The
      # uniffi one generates its scaffolding from the UDL, which lists every
      # variant of rgb_lib::Error: a variant added to the enum and not to the
      # UDL compiles in the library and fails only here. The C-FFI one comes
      # along cheaply. CARGO_TARGET_DIR shares the build of the steps above.
      - name: Bindings build (uniffi UDL mirrors the Error enum; C-FFI)
        env:
          CARGO_TARGET_DIR: target
        run: |
          cargo check --locked --manifest-path bindings/uniffi/Cargo.toml
          cargo check --locked --manifest-path bindings/c-ffi/Cargo.toml

      # cargo tree resolves for any target without its toolchain, so the
      # mobile graphs are checked here without an NDK or Xcode
      - name: Dependency diet guard (app feature set, mobile targets)
        run: |
          banned='^(openssl-sys|openssl-src|native-tls|aws-lc-rs|aws-lc-sys|sqlx-postgres|clap|sea-orm-cli) v'
          status=0
          for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android aarch64-apple-ios; do
            # a failing cargo tree fails the step here instead of passing an
            # empty graph through the grep below
            tree=$(cargo tree --locked --target "$target" -p rgb-lib \
              --no-default-features --features esplora,vss -e normal,build \
              --prefix none -f '{p}')
            if ! printf '%s\n' "$tree" | grep -q '^ring v'; then
              echo "::error::$target: no ring in the graph, the guard is not looking at the app's TLS stack"
              status=1
            fi
            found=$(printf '%s\n' "$tree" | sed 's/ (\*)$//' | grep -E "$banned" | sort -u || true)
            if [ -n "$found" ]; then
              echo "::error::$target pulls crates the fork dropped: $(echo $found)"
              status=1
            else
              echo "$target: ok"
            fi
          done
          exit $status

      # reqwest is compiled with rustls-no-provider. A client built anywhere
      # but api::rest_client_builder (which hands reqwest a prebuilt rustls
      # config) compiles fine and fails at runtime: reqwest's own TLS path
      # panics with "No provider set" when no process-wide CryptoProvider is
      # installed, and otherwise verifies through rustls-platform-verifier,
      # which on Android fails the handshake unless the app initialised it
      # over JNI. The pattern takes a construction by its path
      # (RestClient::, reqwest::[blocking::]Client:: or ClientBuilder::,
      # blocking::Client::) and bare (Client::new, Client::builder,
      # ClientBuilder::new, as after `use reqwest::blocking::Client;`), and
      # reqwest's get, called or imported. This is a grep, not a type check:
      # an alias such as `use reqwest::blocking::Client as Http; Http::new()`
      # still escapes it.
      - name: HTTP clients only through api::rest_client_builder
        run: |
          pattern='RestClient::(new|builder|default)|reqwest::(blocking::)?(Client|ClientBuilder)::|reqwest::(blocking::)?get([^[:alnum:]_]|$)|reqwest::(blocking::)?\{([^}]*[^[:alnum:]_])?get([^[:alnum:]_]|$)|(^|[^[:alnum:]_:])(blocking::)?(Client|ClientBuilder)::(new|builder|default)|(^|[^[:alnum:]_:])blocking::get\('
          if found=$(git grep -nE "$pattern" -- 'src/*.rs' ':!src/api/mod.rs'); then
            echo "::error::an HTTP client is built outside api::rest_client_builder; route it through the builder (ERA.md, dependency diet)"
            printf '%s\n' "$found"
            exit 1
          fi
          # the one legitimate construction must still match, or the
          # pattern has gone stale and the check above proves nothing
          if ! git grep -qE "$pattern" -- src/api/mod.rs; then
            echo "::error::the pattern no longer matches rest_client_builder in src/api/mod.rs; update it"
            exit 1
          fi
          echo "ok: every HTTP client comes from api::rest_client_builder"

      # With OnlineOptions::forwarder_url set, every RGB proxy and reject-list
      # request must reach the loopback forwarder, and the forwarder is the
      # wallet's: go_online stores it, and WalletOnline::proxy_client,
      # reject_list_client and check_proxy_endpoint read it back. Every wallet
      # call site goes through those three. Any other construction compiles
      # fine and picks its own route: ProxyClient::new, RejectListClient::new,
      # check_proxy and rust_only::check_proxy_url go direct, and the _routed
      # forms and check_proxy_url_via_forwarder take whatever forwarder their
      # caller passes, None included. So the step lists every mention in code
      # of the two client types (a construction, a function value, a type in
      # a signature, an import, and so a type alias, a `use ... as` or a macro
      # naming them) and of those checks (called, taken as a value or
      # imported); comment lines are left out. It looks outside the clients'
      # own files and the tests, and fails unless the list is exactly this
      # set: the three helpers (their signatures and bodies), upstream's
      # check_proxy (definition, body, test, import), rust_only's
      # check_proxy_url (no wallet, so no forwarder) and
      # check_proxy_url_via_forwarder (given one explicitly), with their
      # definitions, the crate's imports of the two types, one parameter of
      # type &ProxyClient, and the TLS tests in src/api/mod.rs. A new call
      # site, upstream's or ours, or a second copy of a helper's line changes
      # the set. The compiler cannot enforce this instead (see ERA.md): wallet
      # code has to reach a direct client for the case with no forwarder.
      - name: Proxy and reject-list clients only through the wallet's route
        run: |
          pattern='(^|[^[:alnum:]_])(ProxyClient|RejectListClient)([^[:alnum:]_]|$)|check_proxy(_routed|_url|_url_via_forwarder)?([^[:alnum:]_]|$)'
          found=$(git grep -nE "$pattern" -- 'src/*.rs' ':!src/wallet/test/' \
              ':!src/api/proxy.rs' ':!src/api/reject_list.rs' ':!src/api/forwarder.rs' \
            | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' \
            | sed -E 's/^([^:]+):[0-9]+:[[:space:]]*/\1: /' | LC_ALL=C sort || true)
          expected=(
            'src/wallet/online.rs: fn proxy_client(&self, proxy_url: &str) -> Result<ProxyClient, Error> {'
            'src/wallet/online.rs: ProxyClient::new_routed(proxy_url, self.forwarder())'
            'src/wallet/online.rs: fn reject_list_client(&self, reject_list_url: &str) -> Result<RejectListClient, Error> {'
            'src/wallet/online.rs: RejectListClient::new_routed(reject_list_url, self.forwarder())'
            'src/wallet/online.rs: proxy_client: &ProxyClient,'
            'src/lib.rs: proxy::{GetConsignmentResponse, ProxyClient},'
            'src/lib.rs: reject_list::RejectListClient,'
            'src/wallet/online.rs: check_proxy_routed(proxy_url, self.forwarder())'
            'src/utils.rs: pub(crate) fn check_proxy(proxy_url: &str) -> Result<(), Error> {'
            'src/utils.rs: check_proxy_routed(proxy_url, None)'
            'src/utils.rs: pub(crate) fn check_proxy_routed('
            'src/utils.rs: let proxy_client = ProxyClient::new_routed(proxy_url, forwarder)?;'
            'src/utils.rs: let result = check_proxy(&server.url());'
            'src/lib.rs: INDEXER_STOP_GAP, OffchainResolver, check_proxy, check_proxy_routed,'
            'src/wallet/rust_only.rs: check_proxy(proxy_url)'
            'src/wallet/rust_only.rs: check_proxy_routed(proxy_url, Some(&forwarder))'
            'src/wallet/rust_only.rs: pub fn check_proxy_url(proxy_url: &str) -> Result<(), Error> {'
            'src/wallet/rust_only.rs: pub fn check_proxy_url_via_forwarder(proxy_url: &str, forwarder_url: &str) -> Result<(), Error> {'
            'src/api/mod.rs: proxy::ProxyClient::new("https://proxy.example").unwrap();'
            'src/api/mod.rs: reject_list::RejectListClient::new("https://reject.example").unwrap();'
            'src/api/mod.rs: let proxy = proxy::ProxyClient::new("https://rgb-proxy.utexo.com/json-rpc").unwrap();'
          )
          expected=$(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          if [ "$found" != "$expected" ]; then
            echo "::error::a proxy or reject-list client built outside WalletOnline::proxy_client, reject_list_client and check_proxy_endpoint (ERA.md, proxy forwarder); + is in the tree, - is expected"
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$found") | sed -n 's/^</-/p; s/^>/+/p' || true
            exit 1
          fi
          # upstream's own tests still build ProxyClient::new; if this stops
          # matching, the pattern has gone stale and the check above proves nothing
          if ! git grep -qE "$pattern" -- 'src/wallet/test/'; then
            echo "::error::the pattern no longer matches ProxyClient::new in src/wallet/test; update it"
            exit 1
          fi
          echo "ok: proxy and reject-list clients come only from the wallet's route"

      # SKIP_INIT: these tests are offline and must not try to start the
      # regtest services. The wallet ones create SQLite wallets (migrations on
      # the TLS-less tokio runtime) and exercise the manifest checks the
      # keychain-layout patch extends. The forwarder ones run against local
      # mock servers (indexer, RGB proxy, reject-list host, forwarder), the VSS
      # ones against a scripted VSS server. The VSS and file backup ones also
      # restore backups an older rev wrote (src/wallet/test/fixtures). The
      # scripted-chain ones fund, issue, send and settle on an in-memory chain
      # behind a local Esplora and RGB proxy (src/wallet/test/scripted_chain.rs).
      - name: Unit tests (keychain layout, REST client TLS, proxy forwarder, VSS, backups, offline wallets, scripted chain)
        env:
          SKIP_INIT: "1"
        run: >
          cargo test --locked --lib --features esplora,vss --
          tests_keychain_layout tests_rest_client_tls
          api::forwarder:: wallet::test::forwarder:: wallet::vss::tests::
          wallet::backup::tests::
          wallet::test::new::success wallet::test::load:: wallet::test::get_wallet_data::
          wallet::test::scripted_chain::

      - name: Migration crate with its CLI (the authoring binary still builds)
        run: cargo test --locked -p rgb-lib-migration

  https:
    # Real TLS handshakes: UTEXO's signet RGB proxy through the rustls config
    # of api::rest_client_builder, and UTEXO's signet Esplora indexer through
    # minreq. Nothing else in CI leaves the runner. A failure may be the
    # hosts, not the fork, so it is a signal to look at, not a red branch.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      # --include-ignored: the proxy test is #[ignore] (needs network), the
      # Esplora one is not, and plain --ignored would silently skip it.
      # --exact with a renamed test runs nothing and still passes, so the
      # count is checked as well.
      - name: Real https (RGB proxy, Esplora indexer)
        env:
          SKIP_INIT: "1"
        run: |
          set -o pipefail
          cargo test --locked --lib --features esplora,vss -- \
            --include-ignored --exact \
            api::tests_rest_client_tls::rest_client_talks_to_a_public_https_proxy \
            wallet::test::new::signet_esplora_success 2>&1 | tee https-tests.log
          if ! grep -q '^test result: ok\. 2 passed' https-tests.log; then
            echo "::error::expected exactly the two https tests to run and pass"
            exit 1
          fi
